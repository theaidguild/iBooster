name: Build and Test with Maestro

on:
  workflow_dispatch:
    inputs:
      flow_name:
        type: choice
        options:
          - battery-monitoring
          - data-refresh
          - error-handling
          - home-navigation
          - network-performance
          - onboarding
          - smoke-test
          - storage-analysis
          - theme-toggle
        default: onboarding

jobs:
  build_ios_simulator:
    name: Build iOS for Testing
    type: build
    params:
      platform: ios
      profile: preview # ✅ Has simulator: true
    environment: preview

  maestro_test:
    name: Run Maestro E2E Tests
    type: maestro # ✅ EAS handles everything!
    needs: [build_ios_simulator]
    params:
      build_id: ${{ needs.build_ios_simulator.outputs.build_id }} # ✅ Auto-download
      flow_path: ./maestro/flows/${{ inputs.flow_name }}.yaml
      retries: 2
      record_screen: true
      device_identifier: 'iPhone 16 Pro'
    env:
      MAESTRO_APP_ID: 'com.guigiani.iBooster' # ✅ Available to tests
