appId: com.guigiani.iBooster
---
- launchApp
- evalScript: maestro.wait(5000)
- assertVisible: 'Device Health Score'
- assertVisible: 'Battery'
- tapOn: 'Battery'
- evalScript: maestro.wait(2000)
- tapOn: 'Storage'
- evalScript: maestro.wait(2000)
- assertVisible: 'Storage'
- stopApp: com.guigiani.iBooster
