appId: com.guigiani.iBooster
---
- launchApp
- assertVisible: 'Device Health Score'
- assertVisible: 'Status Overview'
- assertVisible: 'Battery'
- assertVisible: 'Storage'
- assertVisible: 'Network'
- tapOn: 'Battery'
- assertVisible: 'Battery'
- assertVisible: '%'
- tapOn:
    id: 'back-button'
    optional: true
- scrollUntilVisible:
    element: 'Storage'
- tapOn: 'Storage'
- assertVisible: 'Storage Analysis'
- stopApp: com.guigiani.iBooster
