appId: host.exp.Exponent
---
# Test theme switching between light and dark mode
- runFlow: ../helpers/ensure-home-screen.yaml

# Take screenshot of current theme
- takeScreenshot: '01-theme-initial.png'

# Look for theme toggle button (could be in various locations)
- tapOn:
    text: 'Dark.*Mode|Light.*Mode|Theme|🌙|☀️|Settings'
    regex: true
    optional: true

# If we tapped settings, look for theme option
- tapOn:
    text: 'Theme|Appearance|Display'
    regex: true
    optional: true
- wait: 1000

# Try to toggle theme
- tapOn:
    text: 'Dark|Light|Auto|System'
    regex: true
    optional: true
- wait: 2000

# Wait for theme transition animation
- waitForAnimationEnd

# Take screenshot after theme change
- takeScreenshot: '02-theme-changed.png'

# Verify theme actually changed by checking background/text colors
# Navigate to different screens to verify theme consistency
- tapOn: 'Battery'
- wait: 1000
- takeScreenshot: '03-theme-battery-screen.png'

- tapOn:
    text: 'Back|Home|<'
    regex: true
- wait: 1000

- tapOn: 'Storage'
- wait: 1000
- takeScreenshot: '04-theme-storage-screen.png'

- tapOn:
    text: 'Back|Home|<'
    regex: true
- wait: 1000

# Return to home and take final screenshot
- assertVisible: 'Device Health Score'
- takeScreenshot: '05-theme-final.png'
