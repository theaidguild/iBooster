appId: com.guigiani.iBooster
---
# Complete onboarding flow test
- assertVisible:
    text: 'Welcome|Get Started|iBooster'
    regex: true
    timeout: 15000
- takeScreenshot: '01-onboarding-start.png'

# First onboarding screen
- assertVisible: 'Welcome'
- assertVisible: 'Get Started'
- tapOn: 'Get Started'
- runScript:
    script: maestro.wait(1000);
- takeScreenshot: '02-onboarding-step1.png'

# Navigate through onboarding steps
- assertVisible:
    text: 'Continue|Next|Skip'
    regex: true
    optional: true
- tapOn:
    text: 'Continue|Next'
    regex: true
    optional: true
- runScript:
    script: maestro.wait(1000);
- takeScreenshot: '03-onboarding-step2.png'

# Handle potential permission requests
- tapOn:
    text: 'Allow|OK|Continue'
    regex: true
    optional: true
- runScript:
    script: maestro.wait(2000);

# Continue through remaining onboarding steps
- tapOn:
    text: 'Continue|Next|Start.*'
    regex: true
    optional: true
- runScript:
    script: maestro.wait(1000);
- takeScreenshot: '04-onboarding-step3.png'

# Complete onboarding
- tapOn:
    text: 'Start.*|Finish|Complete|Done'
    regex: true
    optional: true
- runScript:
    script: maestro.wait(2000);

# Verify we reached the home screen
- assertVisible:
    text: 'Device Health Score|Battery|Storage|Home'
    regex: true
    timeout: 10000
- takeScreenshot: '05-onboarding-complete.png'
