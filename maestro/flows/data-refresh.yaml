appId: com.guigiani.iBooster
---
# Test data refresh functionality across all screens
- runFlow: ../helpers/ensure-home-screen.yaml

# Test home screen refresh
- takeScreenshot: '01-home-before-refresh.png'
- swipe:
    direction: down
    duration: 1000
- runScript:
    script: maestro.wait(2000);
- takeScreenshot: '02-home-after-refresh.png'

# Test battery screen refresh
- tapOn: 'Battery'
- runScript:
    script: maestro.wait(2000);
- takeScreenshot: '03-battery-before-refresh.png'

# Try pull-to-refresh
- swipe:
    direction: down
    duration: 1000
- runScript:
    script: maestro.wait(2000);

# Try refresh button if available
- tapOn:
    text: 'Refresh|Update|Reload'
    regex: true
    optional: true
- runScript:
    script: maestro.wait(3000);
- takeScreenshot: '04-battery-after-refresh.png'

# Navigate back
- tapOn:
    text: 'Back|<|Home'
    regex: true

# Test storage screen refresh
- tapOn: 'Storage'
- runScript:
    script: maestro.wait(2000);
- takeScreenshot: '05-storage-before-refresh.png'

# Try pull-to-refresh
- swipe:
    direction: down
    duration: 1000
- runScript:
    script: maestro.wait(2000);

# Try refresh/rescan button if available
- tapOn:
    text: 'Refresh|Scan|Update|Reload'
    regex: true
    optional: true
- runScript:
    script: maestro.wait(3000);
- takeScreenshot: '06-storage-after-refresh.png'

# Navigate back
- tapOn:
    text: 'Back|<|Home'
    regex: true

# Test network screen refresh
- tapOn: 'Network'
- runScript:
    script: maestro.wait(2000);
- takeScreenshot: '07-network-before-refresh.png'

# Try pull-to-refresh
- swipe:
    direction: down
    duration: 1000
- runScript:
    script: maestro.wait(2000);

# Try refresh/test button if available
- tapOn:
    text: 'Refresh|Test|Check|Update'
    regex: true
    optional: true
- runScript:
    script: maestro.wait(3000);
- takeScreenshot: '08-network-after-refresh.png'

# Navigate back to home
- tapOn:
    text: 'Back|<|Home'
    regex: true
- runScript:
    script: maestro.wait(1000);
- assertVisible: 'Device Health Score'
- takeScreenshot: '09-refresh-testing-complete.png'
