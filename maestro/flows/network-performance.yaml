appId: host.exp.Exponent
---
# Network performance monitoring test
- runFlow: ../helpers/ensure-home-screen.yaml
- tapOn: 'Network'
- wait: 2000

# Verify network screen loaded
- assertVisible:
    text: 'Network.*Performance|Network.*Status|Connectivity'
    regex: true
- takeScreenshot: '01-network-main.png'

# Check network connection type
- assertVisible:
    text: 'Wi-Fi|WiFi|Cellular|4G|5G|LTE|Connected|Disconnected'
    regex: true
    optional: true

# Look for network speed information
- assertVisible:
    text: 'Speed|Mbps|Download|Upload|Ping|ms'
    regex: true
    optional: true
- takeScreenshot: '02-network-speed.png'

# Test network speed test if available
- tapOn:
    text: 'Test.*Speed|Run.*Test|Check.*Speed'
    regex: true
    optional: true
- wait: 5000
- takeScreenshot: '03-network-speed-test.png'

# Test scrolling to see more network info
- scroll:
    direction: down
- wait: 1000

# Look for network usage statistics
- assertVisible:
    text: 'Usage|Data.*Used|Background|App.*Usage'
    regex: true
    optional: true

# Check for network optimization tips
- assertVisible:
    text: 'Tips|Optimize|Improve.*Connection|Reduce.*Usage'
    regex: true
    optional: true
- takeScreenshot: '04-network-tips.png'

# Test network refresh if available
- tapOn:
    text: 'Refresh|Update|Check.*Again'
    regex: true
    optional: true
- wait: 2000

# Look for connectivity alerts or status
- assertVisible:
    text: 'Alert|Warning|Poor.*Connection|Excellent|Good|Fair'
    regex: true
    optional: true
- takeScreenshot: '05-network-status.png'

# Test any network settings if available
- tapOn:
    text: 'Settings|Preferences|Configure'
    regex: true
    optional: true
- wait: 1000
- takeScreenshot: '06-network-settings.png'

# Navigate back if we opened settings
- tapOn:
    text: 'Back|<'
    regex: true
    optional: true

# Navigate back to home
- tapOn:
    text: 'Back|Home|<'
    regex: true
- assertVisible: 'Device Health Score'
