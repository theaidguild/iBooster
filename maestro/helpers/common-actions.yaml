# Common actions used across multiple test flows

# Skip onboarding quickly
skipOnboarding:
  - tapOn:
      text: 'Get Started|Continue|Next|Skip|Start Using|Done'
      regex: true
      optional: true
  - wait: 1000
  - repeat:
      times: 5
      commands:
        - tapOn:
            text: 'Continue|Next|Skip'
            regex: true
            optional: true
        - wait: 500

# Navigate to home screen from any screen
goToHome:
  - tapOn:
      text: 'Home|Back'
      regex: true
      optional: true
  - wait: 1000
  - assertVisible:
      text: 'Device Health Score|Battery|Storage|Network'
      regex: true
      timeout: 5000

# Common wait for screen transition
waitForTransition:
  - wait: 1500

# Take screenshot with timestamp
takeTimestampedScreenshot:
  - takeScreenshot: 'screen-${timestamp}.png'
