appId: com.guigiani.iBooster
---
# Common actions used across multiple test flows

# Skip onboarding quickly
skipOnboarding:
  - assertVisible:
      text: 'Welcome|Get Started'
      regex: true
      optional: true
  - tapOn:
      text: 'Skip'
      optional: true
  - wait: 1000
  - assertVisible:
      text: 'Device Health Score'
      timeout: 10000

# Navigate to home from any screen
navigateToHome:
  - tapOn:
      text: 'Home|Back|<'
      regex: true
      optional: true
  - wait: 1000
  - assertVisible: 'Device Health Score'

# Take a screenshot with timestamp
takeTimestampedScreenshot:
  - runScript:
      script: |
        const now = new Date();
        const timestamp = now.toISOString().replace(/[:.]/g, '-');
        maestro.output.filename = `screenshot-${timestamp}.png`;
  - takeScreenshot: '${output.filename}'

# Wait for loading to complete
waitForLoading:
  - wait: 2000
  - waitForAnimationEnd

# Handle system permission dialogs
handlePermissionDialog:
  - tapOn:
      text: 'Allow|OK|Continue'
      regex: true
      optional: true
  - wait: 1000

# Scroll to bottom of screen
scrollToBottom:
  - scroll:
      direction: down
  - scroll:
      direction: down
  - scroll:
      direction: down

# Scroll to top of screen
scrollToTop:
  - scroll:
      direction: up
  - scroll:
      direction: up
  - scroll:
      direction: up
