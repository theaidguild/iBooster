# Helper flow to ensure we're on the home screen
# This handles both onboarding completion and navigation back to home

# Wait for app to load
- wait: 3000

# Check current screen state
- runScript:
    script: |
      if (maestro.isVisible("Welcome") || maestro.isVisible("Get Started")) {
        maestro.output.screen = "onboarding";
      } else if (maestro.isVisible("Device Health Score")) {
        maestro.output.screen = "home";
      } else {
        maestro.output.screen = "other";
      }

# If on onboarding, complete it quickly
- tapOn:
    text: 'Get Started|Continue|Next|Skip'
    regex: true
    optional: true
- wait: 1000

# Complete onboarding steps if present
- repeat:
    times: 3
    commands:
      - tapOn:
          text: 'Continue|Next'
          regex: true
          optional: true
      - wait: 1000

# Final tap to complete onboarding
- tapOn:
    text: 'Get Started|Start Using|Done|Continue'
    regex: true
    optional: true
- wait: 2000

# Verify we're on home screen
- assertVisible:
    text: 'Device Health Score|Battery|Storage|Network'
    regex: true
    timeout: 10000
